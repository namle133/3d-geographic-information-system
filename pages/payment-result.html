<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kết quả thanh toán - Vinhomes</title>
  <link rel="stylesheet" href="../css/admin.css" />
  <!-- Runtime environment config -->
  <script src="../js/env-config.js"></script>
  <script src="../js/i18n.js" defer></script>
  <style>
    .result-card {
      max-width: 520px;
      margin: 48px auto;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .result-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    .result-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .result-message {
      color: #666;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .result-detail {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 16px;
      text-align: left;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .result-detail div {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .result-detail div:last-child { border-bottom: none; }
    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-link {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
    }
    .btn-primary-link {
      background: #667eea;
      color: #fff;
    }
    .btn-secondary-link {
      background: #eee;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div class="container">
    <div class="result-card" id="resultCard">
      <div class="loading"><div class="spinner"></div></div>
      <p style="color:#666;margin-top:12px">Đang xác minh thanh toán...</p>
    </div>
  </div>

  <script type="module">
    import invoiceAPI from '../js/api/invoices.js';
    import { formatCurrency } from '../js/utils/helpers.js';

    const card = document.getElementById('resultCard');
    const queryString = window.location.search.slice(1);
    let checking = false;
    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function showResult(icon, title, message, txn, retry = false) {
      card.innerHTML = `
        <div class="result-icon">${icon}</div>
        <div class="result-title">${escapeHTML(title)}</div>
        <div class="result-message">${escapeHTML(message)}</div>
        ${txn ? `<div class="result-detail">
          <div><span>Mã giao dịch</span><strong>${escapeHTML(txn.id)}</strong></div>
          <div><span>Số tiền</span><strong>${escapeHTML(formatCurrency(txn.amount))}</strong></div>
          ${txn.provider_txn_id ? `<div><span>Mã VNPay</span><strong>${escapeHTML(txn.provider_txn_id)}</strong></div>` : ''}
        </div>` : ''}
        <div class="result-actions">
          ${retry ? '<button type="button" class="btn-link btn-secondary-link" id="verifyAgain">Kiểm tra lại</button>' : ''}
          <a class="btn-link btn-primary-link" href="/pages/invoices.html">Xem hóa đơn</a>
        </div>`;
      document.getElementById('verifyAgain')?.addEventListener('click', renderResult);
    }
    async function renderResult() {
      if (checking) return;
      checking = true;
      card.setAttribute('aria-busy', 'true');
      try {
        if (!new URLSearchParams(queryString).get('vnp_TxnRef')) {
          showResult('⚠️', 'Không tìm thấy giao dịch', 'Thiếu thông tin giao dịch từ VNPay.');
          return;
        }
        let res;
        for (let attempt = 0; attempt < 5; attempt++) {
          res = await invoiceAPI.verifyVNPayReturn(queryString);
          const txn = res.data;
          if (res.verified !== true || !txn) throw new Error('Kết quả chưa được xác minh');
          if (res.success === true && txn.status === 'success') {
            showResult(txn.requires_review ? '⚠️' : '✅',
              txn.requires_review ? 'Thanh toán cần đối soát' : 'Thanh toán thành công',
              txn.requires_review ? 'Đã nhận thanh toán. Vui lòng liên hệ ban quản lý để đối soát khoản thu.' : 'Giao dịch đã được xác nhận và hóa đơn đã được cập nhật.', txn);
            return;
          }
          if (txn.status === 'failed' || res.response_code !== '00' || res.transaction_status !== '00') {
            showResult('❌', 'Thanh toán không thành công', 'Giao dịch bị hủy hoặc thất bại. Vui lòng kiểm tra hóa đơn trước khi thanh toán lại.', txn);
            return;
          }
          if (attempt < 4) await new Promise(resolve => setTimeout(resolve, 2000));
        }
        showResult('⏳', 'Đang chờ xác nhận thanh toán', 'Hệ thống chưa nhận được xác nhận từ VNPay. Vui lòng kiểm tra lại; tránh thanh toán lại nếu tài khoản đã bị trừ tiền.', res.data, true);
      } catch (error) {
        showResult('⚠️', 'Chưa thể xác minh thanh toán', 'Vui lòng kiểm tra lại kết quả hoặc liên hệ ban quản lý nếu tài khoản đã bị trừ tiền.', null, true);
      } finally {
        checking = false;
        card.setAttribute('aria-busy', 'false');
      }
    }
    renderResult();
  </script>
</body>
</html>
