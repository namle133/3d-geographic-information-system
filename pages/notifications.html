<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông báo - Vinhomes</title>
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/notifications.css" />
  <!-- Runtime environment config -->
  <script src="../js/env-config.js"></script>
  <script src="../js/i18n.js" defer></script>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div class="container">
    <div class="page-header notification-header">
      <div>
        <h1 class="page-title">Thông báo</h1>
        <p class="page-subtitle">Cập nhật mới nhất về căn hộ và dịch vụ của bạn</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline" id="markAllReadBtn">Đánh dấu tất cả đã đọc</button>
        <button class="btn btn-primary" id="composeBtn" style="display:none">+ Soạn thông báo</button>
      </div>
    </div>

    <div class="kpi-inline" id="notifKpi" style="display:none"></div>

    <div class="tabs" id="tabBar">
      <button class="tab-btn active" data-tab="all">Tất cả</button>
      <button class="tab-btn" data-tab="unread">Chưa đọc</button>
      <button class="tab-btn" data-tab="system" id="systemTab" style="display:none">Hệ thống (Admin)</button>
    </div>

    <div class="notification-toolbar">
      <label class="notification-search"><span aria-hidden="true">⌕</span><span class="sr-only">Tìm thông báo</span><input id="notificationSearch" type="search" placeholder="Tìm theo tiêu đề hoặc nội dung..." /></label>
      <label class="notification-category"><span class="sr-only">Loại thông báo</span><select id="notificationCategory"><option value="">Tất cả loại thông báo</option><option value="general">Thông báo chung</option><option value="contract">Hợp đồng</option><option value="invoice">Hóa đơn</option><option value="maintenance">Bảo trì</option><option value="payment">Thanh toán</option></select></label>
      <span id="notificationResultCount" aria-live="polite"></span>
    </div>
    <div class="section notification-list" id="notifList" aria-busy="true">
      <div class="loading"><div class="spinner"></div><p>Đang tải...</p></div>
    </div>
  </div>

  <dialog id="notificationDetail" aria-labelledby="notificationDetailTitle" aria-describedby="notificationDetailMessage">
    <div class="notification-detail-top"><span id="notificationDetailType" class="notif-type"></span><button type="button" id="closeNotificationDetail" class="detail-close" aria-label="Đóng thông báo">×</button></div>
    <h2 id="notificationDetailTitle" data-no-translate tabindex="-1"></h2>
    <p id="notificationDetailDate" class="notif-meta"></p>
    <div id="notificationDetailMessage" data-no-translate></div>
    <div class="notification-detail-footer"><span id="notificationDetailStatus"></span><button type="button" id="doneNotificationDetail" class="btn btn-primary">Đóng</button></div>
  </dialog>

  <div class="modal" id="composeModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Soạn thông báo</h2>
        <button class="close-btn" id="closeCompose">&times;</button>
      </div>
      <form id="composeForm">
        <div class="form-group">
          <label>Gửi tới</label>
          <select id="notifTarget" required>
            <option value="residents">Tất cả cư dân</option>
            <option value="staff">Tất cả nhân viên</option>
            <option value="managers">Ban quản lý & Admin</option>
            <option value="all_users">Toàn bộ người dùng</option>
            <option value="single">Một người cụ thể</option>
          </select>
        </div>
        <div class="form-group" id="recipientGroup">
          <label>Người nhận</label>
          <select id="notifUserId">
            <option value="">-- Chọn tài khoản --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tiêu đề</label>
          <input type="text" id="notifTitle" required placeholder="Tiêu đề thông báo..." />
        </div>
        <div class="form-group">
          <label>Nội dung</label>
          <textarea id="notifMessage" rows="4" required placeholder="Nội dung chi tiết..."></textarea>
        </div>
        <div class="form-group">
          <label>Loại</label>
          <select id="notifType">
            <option value="general">Thông báo chung</option>
            <option value="contract_expiring">Hợp đồng sắp hết hạn</option>
            <option value="invoice_overdue">Hóa đơn quá hạn</option>
            <option value="maintenance_update">Cập nhật bảo trì</option>
            <option value="payment_received">Đã nhận thanh toán</option>
          </select>
        </div>
        <div class="form-buttons">
          <button type="button" class="btn-cancel" id="cancelCompose">Hủy</button>
          <button type="submit" class="btn btn-primary">Gửi thông báo</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initLayout } from '../js/modules/layout.js';
    import authManager from '../js/modules/auth-manager.js';
    import notificationAPI from '../js/api/notifications.js';
    import usersAPI from '../js/api/users.js';
    import { formatDate, showToast } from '../js/utils/helpers.js';

    if (!await initLayout()) throw new Error("Authentication required");
    const role = authManager.getUserRole();
    const canCompose = ['admin', 'manager'].includes(role);
    const canViewSystem = role === 'admin' || role === 'manager';

    if (canCompose) {
      document.getElementById('composeBtn').style.display = 'inline-flex';
    }
    if (canViewSystem) {
      document.getElementById('systemTab').style.display = 'inline-block';
    }

    let allNotifications = [];
    let unreadCount = 0;
    let currentTab = 'all';
    let loadVersion = 0;

    const TYPE_LABELS = {
      general: 'Thông báo chung',
      contract_expiring: 'HĐ sắp hết hạn',
      contract_approved: 'HĐ đã duyệt',
      contract_rejected: 'HĐ bị từ chối',
      invoice_overdue: 'Hóa đơn quá hạn',
      invoice_generated: 'Hóa đơn mới',
      maintenance_update: 'Bảo trì',
      maintenance_request: 'Yêu cầu bảo trì',
      maintenance_assigned: 'Phân công bảo trì',
      payment_received: 'Đã thanh toán',
      equipment_maintenance: 'Bảo trì thiết bị',
    };

    function parseList(res) {
      if (Array.isArray(res)) return { list: res, unread: res.filter((n) => !n.is_read).length };
      return { list: res.data || [], unread: res.unread_count ?? (res.data || []).filter((n) => !n.is_read).length };
    }

    function typeLabel(type) {
      return TYPE_LABELS[type] || type || 'general';
    }

    async function loadNotifications() {
      const el = document.getElementById('notifList');
      const version = ++loadVersion;
      el.setAttribute('aria-busy', 'true');
      try {
        const scope = currentTab === 'system' ? 'all' : undefined;
        const res = await notificationAPI.getUserNotifications(scope);
        if (version !== loadVersion) return;
        const parsed = parseList(res);
        allNotifications = parsed.list;
        unreadCount = currentTab === 'system' ? parsed.list.filter(n => !n.is_read).length : parsed.unread;
        document.getElementById('markAllReadBtn').hidden = currentTab === 'system';
        document.getElementById('markAllReadBtn').disabled = unreadCount === 0;

        document.getElementById('notifKpi').style.display = 'flex';
        document.getElementById('notifKpi').innerHTML = `
          <span class="pill">Tổng: <strong>${allNotifications.length}</strong></span>
          <span class="pill" style="color:#c62828">Chưa đọc: <strong>${unreadCount}</strong></span>
        `;

        renderList();
        window.dispatchEvent(new CustomEvent('notificationsUpdated'));
      } catch (err) {
        if (version !== loadVersion) return;
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>${escapeHTML(err.message)}</p><button class="btn btn-outline" id="retryNotifications">Thử lại</button></div>`;
        document.getElementById('retryNotifications').addEventListener('click', loadNotifications);
      } finally { if (version === loadVersion) el.setAttribute('aria-busy', 'false'); }
    }

    function renderList() {
      let list = allNotifications;
      if (currentTab === 'unread') {
        list = list.filter((n) => !n.is_read);
      }

      const search = document.getElementById('notificationSearch').value.trim().toLocaleLowerCase();
      const category = document.getElementById('notificationCategory').value;
      list = list.filter(n => (!search || `${n.title} ${n.message}`.toLocaleLowerCase().includes(search)) && (!category || n.type?.includes(category)));
      document.getElementById('notificationResultCount').textContent = `${list.length} thông báo`;
      const el = document.getElementById('notifList');
      if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔔</div><p>${search || category ? 'Không có thông báo phù hợp' : 'Không có thông báo'}</p>${search || category ? '<button class="btn btn-outline" id="clearNotificationFilters">Xóa bộ lọc</button>' : ''}</div>`;
        document.getElementById('clearNotificationFilters')?.addEventListener('click', () => {
          document.getElementById('notificationSearch').value = '';
          document.getElementById('notificationCategory').value = '';
          renderList();
        });
        return;
      }

      el.innerHTML = list.map((n) => `
        <article class="notif-item ${n.is_read ? '' : 'unread'}">
          <div class="notification-icon" aria-hidden="true">${notificationIcon(n.type)}</div>
          <button type="button" class="notification-open" data-id="${escapeHTML(n.id)}" aria-haspopup="dialog">
            <span class="notification-card-meta"><span class="notif-type">${escapeHTML(typeLabel(n.type))}</span>${!n.is_read ? '<span class="notification-unread-label">Chưa đọc</span>' : ''}</span>
            <strong class="notification-title" data-no-translate>${escapeHTML(n.title)}</strong>
            <span class="notification-preview" data-no-translate>${escapeHTML(n.message)}</span>
            <span class="notif-meta">${escapeHTML(formatDate(n.created_at, 'dd/mm/yyyy hh:mm'))}${n.username && currentTab === 'system' ? ` · ${escapeHTML(n.username)}` : ''}</span>
            <span class="notification-expand-hint">Xem chi tiết <span aria-hidden="true">↗</span></span>
          </button>
          <div class="notification-actions">
            ${!n.is_read && currentTab !== 'system' ? `<button class="btn btn-sm btn-outline mark-read" data-id="${escapeHTML(n.id)}">Đã đọc</button>` : ''}
            ${currentTab !== 'system' ? `<button class="btn btn-sm btn-danger delete-notif" data-id="${escapeHTML(n.id)}">Xóa</button>` : ''}
          </div>
        </article>
      `).join('');
      el.querySelectorAll('.notification-open').forEach(button => button.addEventListener('click', () => openNotification(button.dataset.id)));

      el.querySelectorAll('.mark-read').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            await notificationAPI.markNotificationAsRead(btn.dataset.id);
            showToast('Đã đánh dấu đọc', 'success');
            loadNotifications();
          } catch (e) {
            showToast(e.message, 'error');
          }
        });
      });
      el.querySelectorAll('.delete-notif').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm(window.SiteI18n?.translate('Xóa thông báo này?') || 'Xóa thông báo này?')) return;
          try {
            await notificationAPI.deleteNotification(btn.dataset.id);
            showToast('Đã xóa', 'success');
            loadNotifications();
          } catch (e) {
            showToast(e.message, 'error');
          }
        });
      });
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function notificationIcon(type = '') {
      if (type.includes('contract')) return '▤';
      if (type.includes('invoice')) return '▥';
      if (type.includes('maintenance') || type.includes('equipment')) return '⚒';
      if (type.includes('payment')) return '✓';
      return '◉';
    }
    const detail = document.getElementById('notificationDetail');
    let openedNotificationId = null;
    async function openNotification(id) {
      const n = allNotifications.find(n => n.id === id);
      if (!n) return;
      openedNotificationId = id;
      document.getElementById('notificationDetailTitle').textContent = n.title;
      document.getElementById('notificationDetailMessage').textContent = n.message;
      document.getElementById('notificationDetailType').textContent = typeLabel(n.type);
      document.getElementById('notificationDetailDate').textContent = formatDate(n.created_at, 'dd/mm/yyyy hh:mm');
      document.getElementById('notificationDetailStatus').textContent = n.is_read ? 'Đã đọc' : 'Chưa đọc';
      if (!detail.open) detail.showModal();
      document.getElementById('notificationDetailTitle').focus();
      if (!n.is_read && currentTab !== 'system') {
        try {
          await notificationAPI.markNotificationAsRead(id);
          n.is_read = true;
          if (openedNotificationId === id) document.getElementById('notificationDetailStatus').textContent = 'Đã đọc';
          await loadNotifications();
        } catch (error) { showToast(error.message, 'error'); }
      }
    }
    document.getElementById('closeNotificationDetail').addEventListener('click', () => detail.close());
    document.getElementById('doneNotificationDetail').addEventListener('click', () => detail.close());
    detail.addEventListener('click', event => {
      const rect = detail.getBoundingClientRect();
      if (event.target === detail && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) detail.close();
    });
    detail.addEventListener('close', () => {
      const trigger = [...document.querySelectorAll('.notification-open')].find(button => button.dataset.id === openedNotificationId);
      (trigger || document.getElementById('notificationSearch')).focus();
      openedNotificationId = null;
    });
    document.getElementById('notificationSearch').addEventListener('input', renderList);
    document.getElementById('notificationCategory').addEventListener('change', renderList);

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        loadNotifications();
      });
    });

    document.getElementById('markAllReadBtn').addEventListener('click', async () => {
      try {
        await notificationAPI.markAllNotificationsAsRead();
        showToast('Đã đánh dấu tất cả đã đọc', 'success');
        loadNotifications();
      } catch (e) {
        showToast(e.message, 'error');
      }
    });

    const modal = document.getElementById('composeModal');
    document.getElementById('composeBtn').addEventListener('click', () => modal.classList.add('show'));
    document.getElementById('closeCompose').addEventListener('click', () => modal.classList.remove('show'));
    document.getElementById('cancelCompose').addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

    document.getElementById('notifTarget').addEventListener('change', (e) => {
      document.getElementById('recipientGroup').style.display =
        e.target.value === 'single' ? 'block' : 'none';
    });

    async function loadUsersForCompose() {
      if (!canCompose) return;
      try {
        const res = await usersAPI.getUsers();
        const users = res.data || [];
        const select = document.getElementById('notifUserId');
        select.innerHTML = '<option value="">-- Chọn tài khoản --</option>';
        users.filter((u) => u.status === 'active').forEach((u) => {
          const opt = document.createElement('option');
          opt.value = u.id;
          opt.textContent = `${u.username} (${u.role})`;
          select.appendChild(opt);
        });
      } catch (_) {}
    }

    document.getElementById('composeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const target = document.getElementById('notifTarget').value;
      const payload = {
        title: document.getElementById('notifTitle').value.trim(),
        message: document.getElementById('notifMessage').value.trim(),
        type: document.getElementById('notifType').value,
        target,
      };
      if (target === 'single') {
        payload.user_id = document.getElementById('notifUserId').value;
        if (!payload.user_id) {
          showToast('Vui lòng chọn người nhận', 'error');
          return;
        }
      }
      try {
        const res = await notificationAPI.createNotification(payload);
        modal.classList.remove('show');
        document.getElementById('composeForm').reset();
        showToast(res.message || `Đã gửi ${res.count || 1} thông báo`, 'success');
        currentTab = 'all';
        document.querySelector('[data-tab="all"]').classList.add('active');
        document.querySelector('[data-tab="system"]')?.classList.remove('active');
        loadNotifications();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    loadUsersForCompose();
    loadNotifications();
  </script>
</body>
</html>
